name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest -q
      # reads.py runs against the fixture DB (tests/things_schema.sql), and the
      # dashboard's JS runs in real Chromium — no Things app needed anywhere.
